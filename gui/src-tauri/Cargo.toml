[package]
name = "callapicall-control-center"
version = "0.1.0"
description = "Control Center per callAPIcall"
authors = ["Andrea Taini"]
edition = "2021"

[lib]
name = "control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
lto = true
strip = true
